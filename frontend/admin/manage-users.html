<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users · Scrapify admin</title>
  <link rel="icon" href="../assets/logo.svg">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../js/tailwind.components.js"></script>
  <script src="../js/tailwind.config.js"></script>
</head>
<body data-role="admin">
  <main>
    <div class="px-1">
      <h1 class="page-title">Users</h1>
      <p class="muted">Verify new operators and recyclers, and act on accounts that cause problems.</p>
    </div>

    <section class="panel">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <nav id="tabs" aria-label="Filter users"></nav>
        <div class="search w-full sm:w-72">
          <i data-lucide="search"></i>
          <input id="search" type="search" class="input" placeholder="Search name, shop or email">
        </div>
      </div>
      <div id="table" class="mt-6"></div>
    </section>
  </main>

  <script src="../js/app.js" data-page="manage-users"></script>
</body>
</html>
