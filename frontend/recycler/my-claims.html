<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My claims · Scrapify</title>
  <link rel="icon" href="../assets/logo.svg">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../js/tailwind.components.js"></script>
  <script src="../js/tailwind.config.js"></script>
</head>
<body data-role="recycler">
  <main>
    <div class="page-head">
      <div>
        <h1 class="page-title">My claims</h1>
        <p class="muted">Batches you've claimed, plus where your plastic comes from.</p>
      </div>
      <a href="browse-listings.html" class="btn btn-primary">
        <i data-lucide="store"></i><span>Browse listings</span>
      </a>
    </div>

    <div id="stats" class="stats"></div>

    <div class="grid gap-5 lg:grid-cols-2">
      <section class="panel">
        <h2 class="card-title">Sourced by plastic type</h2>
        <div id="byType" class="mt-5 grid gap-4"></div>
      </section>
      <section class="panel">
        <h2 class="card-title">Sourced by location</h2>
        <div id="byPlace" class="mt-5 grid gap-4"></div>
      </section>
    </div>

    <nav id="tabs" aria-label="Filter claims"></nav>
    <div id="grid" class="cards"></div>
  </main>

  <script src="../js/app.js" data-page="my-claims"></script>
</body>
</html>
