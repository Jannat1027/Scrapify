<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan history · Scrapify</title>
  <link rel="icon" href="../assets/logo.svg">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../js/tailwind.components.js"></script>
  <script src="../js/tailwind.config.js"></script>
</head>
<body data-role="operator">
  <main>
    <div class="page-head">
      <div>
        <h1 class="page-title">Scan history</h1>
        <p class="muted">Every batch graded at your collection point.</p>
      </div>
      <a href="new-scan.html" class="btn btn-primary">
        <i data-lucide="plus"></i><span>New scan</span>
      </a>
    </div>

    <section class="panel">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div>
          <h2 class="card-title">Price history</h2>
          <p class="text-sm muted">Estimated value per kg at <span id="location"></span></p>
        </div>
        <span class="badge tone-blue">Mid-point of each estimate</span>
      </div>
      <div class="mt-4 h-64"><canvas id="priceChart" aria-label="Price per kg over time"></canvas></div>
    </section>

    <section class="panel">
      <form id="filters" class="grid gap-3 sm:grid-cols-[1fr_200px_200px]">
        <div class="search">
          <i data-lucide="search"></i>
          <input name="q" class="input" placeholder="Search by scan ID" type="search">
        </div>
        <select name="type" class="input"><option value="">All plastic types</option></select>
        <select name="show" class="input">
          <option value="">Any confidence</option>
          <option value="low">Low confidence</option>
          <option value="corrected">Corrected by me</option>
        </select>
      </form>
      <div id="table" class="mt-6"></div>
    </section>
  </main>

  <script src="../js/app.js" data-page="scan-history" data-libs="chart"></script>
</body>
</html>
