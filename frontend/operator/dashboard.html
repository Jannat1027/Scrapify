<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Scrapify</title>
  <link rel="icon" href="../assets/logo.svg">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../js/tailwind.components.js"></script>
  <script src="../js/tailwind.config.js"></script>
</head>

<body data-role="operator">
  <main>
    <div class="flex flex-wrap items-end justify-between gap-4 px-1">
      <div>
        <p class="text-sm muted" id="greeting"></p>
        <h1 class="text-3xl font-bold tracking-tight" id="orgName"></h1>
      </div>
      <a href="new-scan.html" class="btn btn-primary btn-lg"><i data-lucide="scan-line"></i><span
          data-i18n="side.newScan">New scan</span></a>
    </div>

    <div id="staleNotice"></div>
    <div id="stats" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4"></div>

    <div class="grid gap-5 xl:grid-cols-3">
      <section class="glass p-6 xl:col-span-2">
        <div class="mb-4 flex items-center justify-between">
          <h2 class="text-lg font-semibold">Recent scans</h2>
          <a href="scan-history.html" class="btn btn-ghost btn-sm">View all <i data-lucide="arrow-right"></i></a>
        </div>
        <div id="recentScans"></div>
      </section>

      <section class="glass p-6">
        <h2 class="text-lg font-semibold">Listing status</h2>
        <p class="text-sm muted">Every batch you've put on the market</p>
        <div id="statusBreakdown" class="mt-6 grid gap-5"></div>
        <a href="my-listings.html" class="btn mt-8 w-full">Manage listings</a>
      </section>
    </div>
  </main>

  <script src="../js/app.js" data-page="operator-dashboard"></script>
</body>

</html>
